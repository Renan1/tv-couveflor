<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couve Flor - TV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #111;
    font-family: -apple-system, Arial, sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
  }
  .slide.active {
    opacity: 1;
    z-index: 1;
  }
  .slide img,
  .slide video {
    /* preenche a tela toda, cortando um pouco a borda se precisar,
       em vez de sobrar faixa preta quando o arquivo não é exatamente 16:9 */
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* relógio no canto */
  #clock {
    position: fixed;
    bottom: 28px;
    right: 36px;
    color: rgba(255,255,255,0.85);
    font-size: 56px;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    z-index: 10;
    letter-spacing: 1px;
  }
  /* aviso temporário de erro (some sozinho) - ajuda a diagnosticar arquivo com problema */
  #diag {
    position: fixed;
    top: 16px;
    left: 16px;
    background: rgba(180,0,0,0.85);
    color: #fff;
    font-size: 18px;
    font-family: monospace;
    padding: 10px 16px;
    border-radius: 6px;
    z-index: 20;
    display: none;
    max-width: 80vw;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="clock"></div>
<div id="diag"></div>

<script>
  // ======= CONFIGURAÇÃO =======
  // O conteúdo NÃO é mais listado em código nenhum. A página varre sozinha
  // a pasta "conteudo/" procurando arquivos numerados: 01.png, 02.mp4, 03.jpg...
  // A ordem de exibição é a ordem numérica do nome do arquivo.
  //
  // Pra ADICIONAR: solte o arquivo em "conteudo/" com o próximo número livre.
  // Pra REMOVER: apague o arquivo da pasta.
  // Pra REORDENAR: renomeie o número no nome do arquivo.
  // Não precisa editar este HTML nem nenhuma lista - só mexer nos arquivos.

  const FOLDER = "conteudo/";
  const MAX_ITEMS = 30;        // procura números de 01 até 30 (dá pra aumentar se precisar)
  const IMAGE_EXT = ["jpg", "jpeg", "png", "webp", "gif"];
  const VIDEO_EXT_LIST = ["mp4", "webm", "mov", "m4v"];
  const ALL_EXT = IMAGE_EXT.concat(VIDEO_EXT_LIST);

  const DEFAULT_DURATION = 18000;   // tempo (ms) que cada IMAGEM fica na tela
  const DEFAULT_BG = "#000000";     // cor de fundo atrás do conteúdo

  let slides = [];
  let slideEls = [];
  const stage = document.getElementById("stage");

  function showError(msg) {
    stage.innerHTML =
      '<div style="color:#fff;background:#900;font-size:28px;' +
      'display:flex;align-items:center;justify-content:center;' +
      'width:100%;height:100%;text-align:center;padding:40px;' +
      'font-family:sans-serif;">' + msg + '</div>';
  }

  // mostra um aviso vermelho no canto por alguns segundos, sem travar a apresentação
  let diagTimer = null;
  function flashError(msg) {
    console.error(msg);
    const el = document.getElementById("diag");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(diagTimer);
    diagTimer = setTimeout(() => { el.style.display = "none"; }, 8000);
  }

  async function fileExists(url) {
    try {
      const r = await fetch(url, { method: "HEAD", cache: "no-store" });
      return r.ok;
    } catch (e) {
      return false;
    }
  }

  async function findItemForNumber(n) {
    const num = String(n).padStart(2, "0");
    for (const ext of ALL_EXT) {
      const url = FOLDER + num + "." + ext;
      if (await fileExists(url)) {
        return { src: url, type: VIDEO_EXT_LIST.includes(ext) ? "video" : "image" };
      }
    }
    return null; // esse número não existe - tudo bem, pula (permite "buracos")
  }

  async function scanContent() {
    const numbers = Array.from({ length: MAX_ITEMS }, (_, i) => i + 1);
    const results = await Promise.all(numbers.map(findItemForNumber));
    return results.filter(Boolean);
  }

  scanContent()
    .then((found) => init(found))
    .catch((err) => {
      console.error(err);
      showError("Erro ao escanear a pasta \"conteudo\".<br><br>" + err.message);
    });

  function init(found) {
    if (found.length === 0) {
      showError(
        "Nenhum arquivo encontrado na pasta \"conteudo\".<br>" +
        "Os nomes precisam seguir o padrão 01.png, 02.mp4, 03.jpg..."
      );
      return;
    }

    slides = found.map((f) => ({
      type: f.type,
      src: f.src,
      bg: DEFAULT_BG,
      duration: DEFAULT_DURATION,
    }));

    buildSlides();
    activate(0);
  }

  function buildSlides() {
    slideEls = slides.map((s) => {
      const div = document.createElement("div");
      div.className = "slide";
      div.style.background = s.bg || "#111";

      let media;
      if (s.type === "video") {
        media = document.createElement("video");
        // NÃO carrega o vídeo ainda (preload="none" e sem "src") - o Pi 3 só
        // tem um decodificador de vídeo, então carregar todos de uma vez trava.
        // O src só é setado na hora que o slide vira ativo (ver activate()).
        media.dataset.src = s.src;
        media.muted = true;        // necessário pro autoplay funcionar no Chromium
        media.playsInline = true;
        media.preload = "none";
      } else {
        media = document.createElement("img");
        media.src = s.src;
      }
      div.appendChild(media);
      stage.appendChild(div);
      return div;
    });
  }

  let current = 0;

  function activate(index) {
    const div = slideEls[index];
    const s = slides[index];
    div.classList.add("active");

    if (s.type === "video") {
      const video = div.querySelector("video");
      video.loop = false; // toca uma vez só e para (fica parado no último quadro)
      video.src = video.dataset.src; // carrega só agora, na hora de virar ativo
      video.load();
      video.currentTime = 0;
      video.play().catch((err) => {
        flashError("Não consegui tocar " + s.src + " (autoplay bloqueado: " + err.message + ")");
      });

      // Só avança quando DUAS coisas acontecerem:
      //  1) o vídeo terminou (ou deu erro)
      //  2) o tempo mínimo do slide já passou (mesmo padrão das imagens)
      // Isso resolve tanto vídeo longo (espera terminar, mesmo que passe do mínimo)
      // quanto vídeo curto tipo gif convertido (toca uma vez, congela, e fica
      // parado na tela até completar o tempo normal, só então passa pro próximo).
      let videoEnded = false;
      let minTimeDone = false;
      const tryAdvance = () => { if (videoEnded && minTimeDone) advance(); };

      const onEnded = () => { videoEnded = true; tryAdvance(); };
      const onError = () => {
        const code = video.error ? video.error.code : "?";
        // códigos comuns: 3 = decodificação falhou (formato/codec incompatível), 4 = formato não suportado
        flashError("Erro no vídeo " + s.src + " (código " + code + " - provavelmente codec incompatível, exporte em H.264)");
        advance();
      };
      div._videoDone = onEnded;
      div._videoError = onError;
      video.addEventListener("ended", onEnded, { once: true });
      video.addEventListener("error", onError, { once: true });

      div._minTimer = setTimeout(() => { minTimeDone = true; tryAdvance(); }, s.duration || DEFAULT_DURATION);

      // trava de segurança: se em 3 minutos não terminou nem deu erro, avança assim mesmo.
      // Isso evita que a apresentação trave pra sempre num vídeo com problema.
      div._timer = setTimeout(advance, 180000);
    } else {
      div._timer = setTimeout(advance, s.duration || 8000);
    }
  }

  function deactivate(index) {
    const div = slideEls[index];
    const s = slides[index];
    div.classList.remove("active");
    if (div._timer) {
      clearTimeout(div._timer);
      div._timer = null;
    }
    if (div._minTimer) {
      clearTimeout(div._minTimer);
      div._minTimer = null;
    }
    if (s.type === "video") {
      const video = div.querySelector("video");
      if (div._videoDone) {
        video.removeEventListener("ended", div._videoDone);
        div._videoDone = null;
      }
      if (div._videoError) {
        video.removeEventListener("error", div._videoError);
        div._videoError = null;
      }
      video.pause();
      video.removeAttribute("src");
      video.load(); // libera o vídeo decodificado da memória/GPU do Pi
    }
  }

  function advance() {
    const prev = current;
    current = (current + 1) % slideEls.length;
    activate(current);
    deactivate(prev);
  }

  // relógio (opcional, ajuda a mostrar que a tela está "viva")
  function tickClock() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, "0");
    const mm = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("clock").textContent = hh + ":" + mm;
  }
  tickClock();
  setInterval(tickClock, 1000 * 30);

  // recarrega a página sozinha de tempos em tempos,
  // assim, se você atualizar as imagens no Netlify, a TV pega a versão nova
  // sem precisar mexer no Raspberry Pi.
  setTimeout(() => location.reload(), 1000 * 60 * 30); // 30 minutos
</script>

</body>
</html>
